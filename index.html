<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20A7B3"><title>ReadySetTurn</title><style>body{margin:0;background:#f7f7f4;color:#201f1d;font-family:Inter,system-ui,-apple-system,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.boot div{text-align:center}.mark{font-weight:900;font-size:28px}.mark span{color:#20A7B3}.dot{width:8px;height:8px;border-radius:50%;background:#20A7B3;display:inline-block;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style></head><body><div class="boot"><div><div class="mark">ReadySet<span>Turn</span></div><p>Opening app <i class="dot"></i></p></div></div><script>(async()=>{try{let s='';for(let i=0;i<6;i++)s+=await(await fetch('./payload/part'+i+'.txt',{cache:'no-store'})).text();const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<main style="padding:24px;font-family:system-ui"><h1>ReadySetTurn</h1><p>The app could not start. Refresh the page.</p></main>';console.error(e)}})();</script></body></html>
